<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 3학년 곱셈 연습 게임 (60초)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; user-select: none; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; color: #1e293b; }
    .card { background: white; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 24px; text-align: center; position: relative; overflow: hidden; border: 4px solid #3b82f6; }
    h1 { font-size: 26px; font-weight: 800; color: #1e40af; margin-bottom: 8px; }
    .sub { font-size: 15px; color: #64748b; margin-bottom: 20px; font-weight: 600; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 18px; border-radius: 16px; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
    .timer { color: #dc2626; display: flex; align-items: center; gap: 6px; }
    .score { color: #2563eb; display: flex; align-items: center; gap: 6px; }
    .problem-box { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 30px; border-radius: 20px; font-size: 48px; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); }
    .ans-display { background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 16px; min-height: 64px; font-size: 36px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #0f172a; margin-bottom: 20px; }
    .ans-display.correct { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
    .ans-display.wrong { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .btn { background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 24px; font-weight: 800; color: #1e293b; padding: 14px; cursor: pointer; transition: all 0.1s ease; active: scale(0.95); }
    .btn:active { transform: scale(0.95); background: #cbd5e1; }
    .btn-action { background: #ef4444; color: white; border: none; }
    .btn-submit { background: #22c55e; color: white; border: none; grid-column: span 2; font-size: 22px; }
    .btn-start { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; border: none; font-size: 26px; padding: 16px 32px; border-radius: 18px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 12px rgba(34,197,94,0.4); width: 100%; }
    .feedback { font-size: 18px; font-weight: 700; min-height: 28px; margin-bottom: 12px; }
    .feedback.green { color: #16a34a; }
    .feedback.red { color: #dc2626; }
    .dan-select { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .dan-btn { background: #e2e8f0; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .dan-btn.active { background: #2563eb; color: white; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 18px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>🔢 초등 3학년 곱셈 연습</h1>
    <div class="sub">구구단을 외우고 60초 동안 점수를 올려보세요!</div>

    <div id="start-screen">
      <div style="margin-bottom: 20px;">
        <div style="font-weight: 700; margin-bottom: 8px;">연습할 구구단 선택:</div>
        <div class="dan-select" id="dan-options"></div>
      </div>
      <button class="btn-start" onclick="startGame()">🚀 60초 도전 시작!</button>
    </div>

    <div id="game-screen" style="display: none;">
      <div class="top-bar">
        <div class="timer">⏱️ <span id="time-left">60</span>초</div>
        <div class="score">⭐ <span id="score">0</span>점</div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="problem-box" id="problem">? × ?</div>

      <div class="ans-display" id="user-input"></div>

      <div class="keypad">
        <button class="btn" onclick="pressKey('1')">1</button>
        <button class="btn" onclick="pressKey('2')">2</button>
        <button class="btn" onclick="pressKey('3')">3</button>
        <button class="btn" onclick="pressKey('4')">4</button>
        <button class="btn" onclick="pressKey('5')">5</button>
        <button class="btn" onclick="pressKey('6')">6</button>
        <button class="btn" onclick="pressKey('7')">7</button>
        <button class="btn" onclick="pressKey('8')">8</button>
        <button class="btn" onclick="pressKey('9')">9</button>
        <button class="btn btn-action" onclick="pressKey('C')">C</button>
        <button class="btn" onclick="pressKey('0')">0</button>
        <button class="btn btn-action" onclick="pressKey('←')">⌫</button>
        <button class="btn btn-submit" onclick="submitAnswer()">정답 확인 ↵</button>
      </div>
    </div>

    <div id="end-screen" style="display: none;">
      <div id="result-emoji" style="font-size: 64px; margin-bottom: 10px;">🏆</div>
      <div class="badge" id="result-grade" style="background: #fef08a; color: #854d0e;">곱셈 마스터!</div>
      <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 12px;" id="final-score">150점</h2>
      <p style="font-size: 16px; color: #475569; margin-bottom: 20px;" id="result-msg">우와! 대단한 실력이에요!</p>
      
      <div style="background: #f8fafc; padding: 16px; border-radius: 16px; margin-bottom: 20px; font-weight: 700; color: #334155; text-align: left;">
        <div>✅ 맞춘 문제: <span id="stat-correct">0</span>개</div>
        <div>❌ 틀린 문제: <span id="stat-wrong">0</span>개</div>
        <div>🔥 연속 정답 기록: <span id="stat-streak">0</span>개</div>
      </div>

      <button class="btn-start" onclick="restartGame()">🔄 다시 도전하기</button>
    </div>
  </div>

  <script>
    let selectedDan = 'all';
    let timer = null;
    let timeLeft = 60;
    let score = 0;
    let currentInput = '';
    let currentQ = { n1: 2, n2: 2, ans: 4 };
    let correctCount = 0;
    let wrongCount = 0;
    let streak = 0;
    let maxStreak = 0;
    let isProcessing = false;

    const dans = [
      { id: 'all', label: '전체 (2~9단)' },
      { id: '2-5', label: '기초 (2~5단)' },
      { id: '6-9', label: '심화 (6~9단)' },
      { id: '7', label: '7단만' },
      { id: '8', label: '8단만' },
      { id: '9', label: '9단만' }
    ];

    function initDanOptions() {
      const container = document.getElementById('dan-options');
      container.innerHTML = dans.map(d => 
        `<button class="dan-btn ${selectedDan === d.id ? 'active' : ''}" onclick="selectDan('${d.id}')">${d.label}</button>`
      ).join('');
    }

    function selectDan(id) {
      selectedDan = id;
      initDanOptions();
    }

    function generateQuestion() {
      let n1;
      if (selectedDan === 'all') {
        n1 = Math.floor(Math.random() * 8) + 2; // 2~9
      } else if (selectedDan === '2-5') {
        n1 = Math.floor(Math.random() * 4) + 2; // 2~5
      } else if (selectedDan === '6-9') {
        n1 = Math.floor(Math.random() * 4) + 6; // 6~9
      } else {
        n1 = parseInt(selectedDan);
      }
      const n2 = Math.floor(Math.random() * 9) + 1; // 1~9
      currentQ = { n1, n2, ans: n1 * n2 };
      document.getElementById('problem').innerText = `${n1} × ${n2} = ?`;
      currentInput = '';
      updateInputDisplay();
    }

    function updateInputDisplay() {
      const disp = document.getElementById('user-input');
      disp.innerText = currentInput || '답을 입력하세요';
      disp.className = 'ans-display';
    }

    function pressKey(key) {
      if (isProcessing) return;
      if (key === 'C') {
        currentInput = '';
      } else if (key === '←') {
        currentInput = currentInput.slice(0, -1);
      } else if (currentInput.length < 3) {
        currentInput += key;
      }
      updateInputDisplay();
    }

    function submitAnswer() {
      if (isProcessing || !currentInput) return;
      isProcessing = true;

      const userVal = parseInt(currentInput);
      const disp = document.getElementById('user-input');
      const feedback = document.getElementById('feedback');

      if (userVal === currentQ.ans) {
        score += 10;
        correctCount++;
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        disp.className = 'ans-display correct';
        disp.innerText = '⭕ 정답!';
        feedback.innerText = `🎉 정답이에요! (+10점) ${streak > 1 ? streak + '연속 정답! 🔥' : ''}`;
        feedback.className = 'feedback green';
      } else {
        wrongCount++;
        streak = 0;
        disp.className = 'ans-display wrong';
        disp.innerText = `❌ 오답 (${currentQ.ans})`;
        feedback.innerText = `아쉬워요! ${currentQ.n1} × ${currentQ.n2} = ${currentQ.ans} 이예요!`;
        feedback.className = 'feedback red';
      }

      document.getElementById('score').innerText = score;

      setTimeout(() => {
        feedback.innerText = '';
        isProcessing = false;
        generateQuestion();
      }, 900);
    }

    function startGame() {
      score = 0;
      timeLeft = 60;
      correctCount = 0;
      wrongCount = 0;
      streak = 0;
      maxStreak = 0;
      isProcessing = false;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      document.getElementById('score').innerText = '0';
      document.getElementById('time-left').innerText = '60';

      generateQuestion();

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';

      document.getElementById('final-score').innerText = score + '점';
      document.getElementById('stat-correct').innerText = correctCount;
      document.getElementById('stat-wrong').innerText = wrongCount;
      document.getElementById('stat-streak').innerText = maxStreak;

      let emoji = '🌱';
      let title = '곱셈 새싹이!';
      let msg = '차근차근 연습하면 금방 곱셈 달인이 될 수 있어요!';

      if (score >= 200) {
        emoji = '🏆'; title = '곱셈 전설 마스터!'; msg = '우와! 구구단 왕국의 전설적인 최고 영웅이에요! 🎉';
      } else if (score >= 150) {
        emoji = '👑'; title = '곱셈 왕국 박사님!'; msg = '대단해요! 구구단을 번개처럼 빠르게 풀어냈어요! ⚡';
      } else if (score >= 100) {
        emoji = '⭐'; title = '곱셈 달인!'; msg = '훌륭해요! 조금만 더 연습하면 전설 마스터가 돼요! 💪';
      } else if (score >= 50) {
        emoji = '🚀'; title = '곱셈 유망주!'; msg = '실력이 쑥쑥 늘고 있어요! 다시 도전해볼까요? 🌟';
      }

      document.getElementById('result-emoji').innerText = emoji;
      document.getElementById('result-grade').innerText = title;
      document.getElementById('result-msg').innerText = msg;
    }

    function restartGame() {
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('game-screen').style.display === 'block') {
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('←');
        else if (e.key === 'Enter') submitAnswer();
        else if (e.key === 'Escape') pressKey('C');
      }
    });

    initDanOptions();
  </script>
</body>
</html>
