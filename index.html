<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 3학년 곱셈 연습 게임 (60초)</title>
  <!-- Firebase SDK via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; user-select: none; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; color: #1e293b; }
    .card { background: white; border-radius: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); width: 100%; max-width: 540px; padding: 24px; text-align: center; position: relative; overflow: hidden; border: 4px solid #3b82f6; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 800; color: #1e40af; margin-bottom: 8px; }
    .sub { font-size: 15px; color: #64748b; margin-bottom: 20px; font-weight: 600; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 18px; border-radius: 16px; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
    .timer { color: #dc2626; display: flex; align-items: center; gap: 6px; }
    .score { color: #2563eb; display: flex; align-items: center; gap: 6px; }
    .problem-box { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 30px; border-radius: 20px; font-size: 48px; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); }
    .ans-display { background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 16px; min-height: 64px; font-size: 36px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #0f172a; margin-bottom: 20px; }
    .ans-display.correct { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
    .ans-display.wrong { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .btn { background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 24px; font-weight: 800; color: #1e293b; padding: 14px; cursor: pointer; transition: all 0.1s ease; }
    .btn:active { transform: scale(0.95); background: #cbd5e1; }
    .btn-action { background: #ef4444; color: white; border: none; }
    .btn-submit { background: #22c55e; color: white; border: none; grid-column: span 2; font-size: 22px; }
    .btn-start { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; font-size: 22px; padding: 16px 32px; border-radius: 18px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 12px rgba(245,158,11,0.4); width: 100%; }
    .feedback { font-size: 18px; font-weight: 700; min-height: 28px; margin-bottom: 12px; }
    .feedback.green { color: #16a34a; }
    .feedback.red { color: #dc2626; }
    .dan-select { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .dan-btn { background: #e2e8f0; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .dan-btn.active { background: #2563eb; color: white; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 18px; margin-bottom: 12px; }
    
    /* Board Styling */
    .board-card { background: white; border-radius: 28px; border: 4px solid #38bdf8; padding: 20px; width: 100%; max-width: 540px; text-align: left; margin-bottom: 30px; }
    .board-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid #e0f2fe; margin-bottom: 14px; }
    .board-title { font-size: 18px; font-weight: 900; color: #0c4a6e; display: flex; align-items: center; gap: 6px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 14px; font-weight: 800; font-size: 13px; border: 2px solid #bae6fd; background: #f0f9ff; color: #0369a1; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
    .record-item { display: flex; items-center; justify-content: space-between; padding: 10px 12px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; margin-bottom: 8px; }
    .record-rank { width: 32px; h-32px; border-radius: 10px; background: #e2e8f0; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-right: 10px; font-size: 14px; shrink: 0; }
    .record-top1 { background: #fef08a; color: #713f12; }
    .record-top2 { background: #e2e8f0; color: #334155; }
    .record-top3 { background: #ffedd5; color: #9a3412; }
    .input-box { width: 100%; padding: 8px 12px; border-radius: 10px; border: 2px solid #bae6fd; font-size: 13px; font-weight: 700; margin-bottom: 8px; outline: none; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>✏️ 신나는 60초 곱셈 챌린지</h1>
    <div class="sub">구구단을 외우고 실시간 학급 리더보드에 올라보세요!</div>

    <div id="start-screen">
      <div style="margin-bottom: 20px;">
        <div style="font-weight: 700; margin-bottom: 8px;">연습할 구구단 선택:</div>
        <div class="dan-select" id="dan-options"></div>
      </div>
      <button class="btn-start" onclick="startGame()">🚀 60초 도전 시작!</button>
    </div>

    <div id="game-screen" style="display: none;">
      <div class="top-bar">
        <div class="timer">⏱️ <span id="time-left">60</span>초</div>
        <div class="score">⭐ <span id="score">0</span>점</div>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="problem-box" id="problem">? × ?</div>
      <div class="ans-display" id="user-input"></div>

      <div class="keypad">
        <button class="btn" onclick="pressKey('1')">1</button>
        <button class="btn" onclick="pressKey('2')">2</button>
        <button class="btn" onclick="pressKey('3')">3</button>
        <button class="btn" onclick="pressKey('4')">4</button>
        <button class="btn" onclick="pressKey('5')">5</button>
        <button class="btn" onclick="pressKey('6')">6</button>
        <button class="btn" onclick="pressKey('7')">7</button>
        <button class="btn" onclick="pressKey('8')">8</button>
        <button class="btn" onclick="pressKey('9')">9</button>
        <button class="btn btn-action" onclick="pressKey('C')">C</button>
        <button class="btn" onclick="pressKey('0')">0</button>
        <button class="btn btn-action" onclick="pressKey('←')">⌫</button>
        <button class="btn btn-submit" onclick="submitAnswer()">정답 확인 ↵</button>
      </div>
    </div>

    <div id="end-screen" style="display: none;">
      <div id="result-emoji" style="font-size: 56px; margin-bottom: 8px;">🏆</div>
      <div class="badge" id="result-grade" style="background: #fef08a; color: #854d0e;">곱셈 마스터!</div>
      <h2 style="font-size: 28px; font-weight: 900; margin-bottom: 8px;" id="final-score">150점</h2>
      <p style="font-size: 14px; color: #475569; margin-bottom: 16px;" id="result-msg">우와! 대단한 실력이에요!</p>
      
      <!-- Score Register Box -->
      <div style="background: #f0f9ff; border: 2px solid #7dd3fc; padding: 14px; border-radius: 18px; margin-bottom: 16px; text-align: left;" id="reg-box">
        <div style="font-weight: 900; color: #0369a1; font-size: 14px; margin-bottom: 8px;">🏆 실시간 리더보드 점수 등록</div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="reg-name" placeholder="학생 이름 (예: 김민준)" class="input-box" style="flex: 1;" required>
          <input type="text" id="reg-class" placeholder="학년/반 (예: 3학년 1반)" class="input-box" style="flex: 1;">
        </div>
        <input type="text" id="reg-msg" placeholder="소감 한마디 (예: 200점 달성!)" class="input-box">
        <button onclick="registerScore()" style="width: 100%; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 12px; font-weight: 900; cursor: pointer;">
          명예의 전당에 내 점수 올리기 🚀
        </button>
      </div>

      <button class="btn-start" onclick="restartGame()">🔄 다시 도전하기</button>
    </div>
  </div>

  <!-- Realtime Class Board Container -->
  <div class="board-card">
    <div class="board-header">
      <div class="board-title">
        <span>🏆 우리 반 실시간 게시판</span>
      </div>
      <span style="font-size: 11px; font-weight: 800; background: #ecfdf5; color: #047857; padding: 4px 8px; border-radius: 12px; border: 1px solid #a7f3d0;">
        🟢 파이어베이스 실시간 연동
      </span>
    </div>

    <div class="tabs">
      <div class="tab-btn active" id="tab-leaderboard-btn" onclick="switchTab('leaderboard')">명예의 전당 🥇</div>
      <div class="tab-btn" id="tab-messages-btn" onclick="switchTab('messages')">응원의 한마디 💬</div>
    </div>

    <!-- Leaderboard Content -->
    <div id="tab-leaderboard">
      <div id="board-records-list" style="max-height: 220px; overflow-y: auto;">
        <div style="text-align: center; color: #64748b; padding: 20px; font-size: 13px;">불러오는 중...</div>
      </div>
    </div>

    <!-- Messages Content -->
    <div id="tab-messages" style="display: none;">
      <div style="display: flex; gap: 6px; margin-bottom: 12px;">
        <input type="text" id="msg-sender" placeholder="이름" class="input-box" style="width: 30%; margin-bottom: 0;">
        <input type="text" id="msg-text" placeholder="응원 메시지 입력" class="input-box" style="flex: 1; margin-bottom: 0;">
        <button onclick="postCheerMessage()" style="background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; cursor: pointer; shrink: 0;">
          등록
        </button>
      </div>
      <div id="board-messages-list" style="max-height: 200px; overflow-y: auto;">
        <div style="text-align: center; color: #64748b; padding: 20px; font-size: 13px;">불러오는 중...</div>
      </div>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBu0FwBdxvuygozDXWFqGhGd6K0fmffX2Q",
      authDomain: "my-class-board-89979.firebaseapp.com",
      projectId: "my-class-board-89979",
      storageBucket: "my-class-board-89979.firebasestorage.app",
      messagingSenderId: "236465176649",
      appId: "1:236465176649:web:6a86a4ed8d691b6439bf98",
      databaseURL: "https://my-class-board-89979-default-rtdb.firebaseio.com"
    };

    let rtdb = null;
    let localScores = [
      { studentName: '김민준', gradeClass: '3학년 1반', score: 180, correctCount: 18, danRange: '전체 (2~9단)', message: '마스터 완료! 👑' },
      { studentName: '이서연', gradeClass: '3학년 2반', score: 150, correctCount: 15, danRange: '6~9단', message: '7단, 8단도 문제없어요! ✨' }
    ];
    let localMessages = [
      { senderName: '선생님', text: '3학년 여러분! 오늘 구구단 화이팅입니다! 🎉' }
    ];

    if (typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(firebaseConfig);
        rtdb = firebase.database();
      } catch (e) {
        console.warn('Firebase init fallback:', e);
      }
    }

    // Subscribe Leaderboard & Messages
    function initFirebaseListeners() {
      if (rtdb) {
        rtdb.ref('scores').limitToLast(50).on('value', (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const list = [];
            Object.keys(data).forEach(k => list.push(data[k]));
            list.sort((a, b) => b.score - a.score || b.timestamp - a.timestamp);
            renderLeaderboard(list);
          } else {
            renderLeaderboard(localScores);
          }
        }, () => renderLeaderboard(localScores));

        rtdb.ref('messages').limitToLast(30).on('value', (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const list = [];
            Object.keys(data).forEach(k => list.push(data[k]));
            list.sort((a, b) => b.timestamp - a.timestamp);
            renderMessages(list);
          } else {
            renderMessages(localMessages);
          }
        }, () => renderMessages(localMessages));
      } else {
        renderLeaderboard(localScores);
        renderMessages(localMessages);
      }
    }

    function renderLeaderboard(list) {
      const container = document.getElementById('board-records-list');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">기록이 없습니다.</div>';
        return;
      }
      container.innerHTML = list.map((item, idx) => {
        const rank = idx + 1;
        const topClass = rank === 1 ? 'record-top1' : rank === 2 ? 'record-top2' : rank === 3 ? 'record-top3' : '';
        const badge = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        return `
          <div class="record-item">
            <div style="display: flex; align-items: center;">
              <div class="record-rank ${topClass}">${badge}</div>
              <div>
                <div style="font-weight: 800; font-size: 14px; color: #0f172a;">
                  ${item.studentName || '학생'} <span style="font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 6px;">${item.gradeClass || '3학년'}</span>
                </div>
                ${item.message ? `<div style="font-size: 11px; color: #0284c7; font-weight: 700;">"${item.message}"</div>` : ''}
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: 900; font-size: 16px; color: #0369a1;">${item.score}점</div>
              <div style="font-size: 10px; color: #64748b;">${item.correctCount || 0}문제 (${item.danRange || '전체'})</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMessages(list) {
      const container = document.getElementById('board-messages-list');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">등록된 응원이 없습니다.</div>';
        return;
      }
      container.innerHTML = list.map(m => `
        <div style="background: #f8fafc; padding: 8px 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px;">
          <div style="font-weight: 800; font-size: 12px; color: #0284c7;">${m.senderName || '익명'}</div>
          <div style="font-size: 12px; font-weight: 700; color: #334155;">${m.text || ''}</div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('tab-leaderboard').style.display = tab === 'leaderboard' ? 'block' : 'none';
      document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
      document.getElementById('tab-leaderboard-btn').className = 'tab-btn ' + (tab === 'leaderboard' ? 'active' : '');
      document.getElementById('tab-messages-btn').className = 'tab-btn ' + (tab === 'messages' ? 'active' : '');
    }

    function registerScore() {
      const name = document.getElementById('reg-name').value.trim();
      const grade = document.getElementById('reg-class').value.trim() || '3학년';
      const msg = document.getElementById('reg-msg').value.trim();
      if (!name) { alert('학생 이름을 입력해주세요!'); return; }

      const record = {
        studentName: name,
        gradeClass: grade,
        score: score,
        correctCount: correctCount,
        danRange: selectedDan === 'all' ? '전체 (2~9단)' : selectedDan + '단',
        message: msg,
        timestamp: Date.now()
      };

      if (rtdb) {
        rtdb.ref('scores').push(record);
      }
      localScores.unshift(record);
      renderLeaderboard(localScores);
      document.getElementById('reg-box').innerHTML = '<div style="color: #047857; font-weight: 900; text-align: center; padding: 10px;">✅ 명예의 전당에 점수가 등록되었습니다!</div>';
    }

    function postCheerMessage() {
      const sender = document.getElementById('msg-sender').value.trim();
      const text = document.getElementById('msg-text').value.trim();
      if (!sender || !text) { alert('이름과 응원 메시지를 모두 입력해주세요!'); return; }

      const msgObj = { senderName: sender, text: text, timestamp: Date.now() };
      if (rtdb) {
        rtdb.ref('messages').push(msgObj);
      }
      localMessages.unshift(msgObj);
      renderMessages(localMessages);
      document.getElementById('msg-text').value = '';
    }

    let selectedDan = 'all';
    let timer = null;
    let timeLeft = 60;
    let score = 0;
    let currentInput = '';
    let currentQ = { n1: 2, n2: 2, ans: 4 };
    let correctCount = 0;
    let wrongCount = 0;
    let streak = 0;
    let maxStreak = 0;
    let isProcessing = false;

    const dans = [
      { id: 'all', label: '전체 (2~9단)' },
      { id: '2-5', label: '기초 (2~5단)' },
      { id: '6-9', label: '심화 (6~9단)' },
      { id: '7', label: '7단만' },
      { id: '8', label: '8단만' },
      { id: '9', label: '9단만' }
    ];

    function initDanOptions() {
      const container = document.getElementById('dan-options');
      container.innerHTML = dans.map(d => 
        `<button class="dan-btn ${selectedDan === d.id ? 'active' : ''}" onclick="selectDan('${d.id}')">${d.label}</button>`
      ).join('');
    }

    function selectDan(id) {
      selectedDan = id;
      initDanOptions();
    }

    function generateQuestion() {
      let n1;
      if (selectedDan === 'all') {
        n1 = Math.floor(Math.random() * 8) + 2;
      } else if (selectedDan === '2-5') {
        n1 = Math.floor(Math.random() * 4) + 2;
      } else if (selectedDan === '6-9') {
        n1 = Math.floor(Math.random() * 4) + 6;
      } else {
        n1 = parseInt(selectedDan);
      }
      const n2 = Math.floor(Math.random() * 9) + 1;
      currentQ = { n1, n2, ans: n1 * n2 };
      document.getElementById('problem').innerText = `${n1} × ${n2} = ?`;
      currentInput = '';
      updateInputDisplay();
    }

    function updateInputDisplay() {
      const disp = document.getElementById('user-input');
      disp.innerText = currentInput || '답을 입력하세요';
      disp.className = 'ans-display';
    }

    function pressKey(key) {
      if (isProcessing) return;
      if (key === 'C') {
        currentInput = '';
      } else if (key === '←') {
        currentInput = currentInput.slice(0, -1);
      } else if (currentInput.length < 3) {
        currentInput += key;
      }
      updateInputDisplay();
    }

    function submitAnswer() {
      if (isProcessing || !currentInput) return;
      isProcessing = true;

      const userVal = parseInt(currentInput);
      const disp = document.getElementById('user-input');
      const feedback = document.getElementById('feedback');

      if (userVal === currentQ.ans) {
        score += 10;
        correctCount++;
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        disp.className = 'ans-display correct';
        disp.innerText = '⭕ 정답!';
        feedback.innerText = `🎉 정답이에요! (+10점) ${streak > 1 ? streak + '연속 정답! 🔥' : ''}`;
        feedback.className = 'feedback green';
      } else {
        wrongCount++;
        streak = 0;
        disp.className = 'ans-display wrong';
        disp.innerText = `❌ 오답 (${currentQ.ans})`;
        feedback.innerText = `아쉬워요! ${currentQ.n1} × ${currentQ.n2} = ${currentQ.ans} 이예요!`;
        feedback.className = 'feedback red';
      }

      document.getElementById('score').innerText = score;

      setTimeout(() => {
        feedback.innerText = '';
        isProcessing = false;
        generateQuestion();
      }, 900);
    }

    function startGame() {
      score = 0;
      timeLeft = 60;
      correctCount = 0;
      wrongCount = 0;
      streak = 0;
      maxStreak = 0;
      isProcessing = false;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      document.getElementById('score').innerText = '0';
      document.getElementById('time-left').innerText = '60';

      generateQuestion();

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';

      document.getElementById('final-score').innerText = score + '점';

      let emoji = '🌱';
      let title = '곱셈 새싹이!';
      let msg = '차근차근 연습하면 금방 곱셈 달인이 될 수 있어요!';

      if (score >= 200) {
        emoji = '🏆'; title = '곱셈 전설 마스터!'; msg = '우와! 구구단 왕국의 전설적인 최고 영웅이에요! 🎉';
      } else if (score >= 150) {
        emoji = '👑'; title = '곱셈 왕국 박사님!'; msg = '대단해요! 구구단을 번개처럼 빠르게 풀어냈어요! ⚡';
      } else if (score >= 100) {
        emoji = '⭐'; title = '곱셈 달인!'; msg = '훌륭해요! 조금만 더 연습하면 전설 마스터가 돼요! 💪';
      } else if (score >= 50) {
        emoji = '🚀'; title = '곱셈 유망주!'; msg = '실력이 쑥쑥 늘고 있어요! 다시 도전해볼까요? 🌟';
      }

      document.getElementById('result-emoji').innerText = emoji;
      document.getElementById('result-grade').innerText = title;
      document.getElementById('result-msg').innerText = msg;
    }

    function restartGame() {
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('game-screen').style.display === 'block') {
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressKey('←');
        else if (e.key === 'Enter') submitAnswer();
        else if (e.key === 'Escape') pressKey('C');
      }
    });

    initDanOptions();
    initFirebaseListeners();
  </script>
</body>
</html>
